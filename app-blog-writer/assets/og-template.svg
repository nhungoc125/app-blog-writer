<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Featured / Open Graph image template for app-blog-writer.
    Replace every {{PLACEHOLDER}}:
      {{SURFACE}}   page background (brand surface or muted)       e.g. #F4F6FA
      {{INK}}       main text color                                e.g. #121A2B
      {{MUTED}}     secondary text color                           e.g. #5B6474
      {{PRIMARY}}   brand primary color                            e.g. #3A45C9
      {{PRIMARY_TINT}} light tint of primary (10-15% on surface)   e.g. #E6E8FA
      {{FONT}}      brand font stack                               e.g. Inter, 'Segoe UI', Helvetica, Arial, sans-serif
      {{EYEBROW}}   short category label, sentence case            e.g. Guides
      {{TITLE_LINE_1}}, {{TITLE_LINE_2}}  title split into <= 2 lines of ~22 chars each (wider fonts: fewer) (delete line 2 if unused)
      {{BRAND_NAME}} product name shown bottom-left
    The right-hand panel is a placeholder for a small UI fragment or diagram from the post;
    replace the <g id="visual"> contents, or delete it and widen the title area.
  -->
  <rect width="1200" height="630" fill="{{SURFACE}}"/>
  <circle cx="1120" cy="40" r="260" fill="{{PRIMARY_TINT}}"/>
  <g font-family="{{FONT}}">
    <rect x="72" y="88" width="10" height="40" rx="5" fill="{{PRIMARY}}"/>
    <text x="96" y="117" font-size="24" fill="{{MUTED}}">{{EYEBROW}}</text>
    <text x="72" y="236" font-size="52" font-weight="700" fill="{{INK}}">{{TITLE_LINE_1}}</text>
    <text x="72" y="300" font-size="52" font-weight="700" fill="{{INK}}">{{TITLE_LINE_2}}</text>
    <rect x="72" y="518" width="32" height="32" rx="8" fill="{{PRIMARY}}"/>
    <text x="118" y="542" font-size="24" font-weight="700" fill="{{INK}}">{{BRAND_NAME}}</text>
  </g>
  <g id="visual">
    <rect x="852" y="150" width="276" height="330" rx="20" fill="#FFFFFF" stroke="{{PRIMARY_TINT}}" stroke-width="2"/>
    <rect x="880" y="182" width="160" height="16" rx="8" fill="{{PRIMARY_TINT}}"/>
    <rect x="880" y="214" width="220" height="12" rx="6" fill="{{PRIMARY_TINT}}"/>
    <rect x="880" y="236" width="180" height="12" rx="6" fill="{{PRIMARY_TINT}}"/>
    <rect x="880" y="410" width="130" height="40" rx="10" fill="{{PRIMARY}}"/>
  </g>
</svg>
